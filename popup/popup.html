<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Minerva Forum Customizer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <div class="header-row">
          <div>
            <h2>Minerva Customizer</h2>
            <p class="subtitle">Personalize your Minerva header, fonts, and theme palette.</p>
          </div>
        </div>

        <label>Theme
          <select id="theme-select">
            <option value="default">Default</option>
            <option value="charcoal">Carbon Blue</option>
            <option value="high-contrast">High Contrast</option>
            <option value="forest">Deep Forest</option>
            <option value="burgundy">Burgundy</option>
            <option value="ultraviolet">Ultraviolet</option>
            <option value="ocean">Abyss Ocean</option>
            <option value="ember">Ember</option>
          </select>
        </label>

        <label>Body Font
          <select id="font-select">
            <option value="default">Default</option>
            <option value="verdana">Verdana</option>
            <option value="georgia">Georgia</option>
            <option value="mono">Courier Mono</option>
            <option value="trebuchet">Trebuchet</option>
            <option value="palatino">Palatino</option>
            <option value="impact">Impact</option>
            <option value="comic">Comic</option>
            <option value="optima">Optima</option>
            <option value="lucida">Lucida Console</option>
            <option value="copperplate">Copperplate</option>
            <option value="garamond">Garamond</option>
            <option value="futura">Futura</option>
          </select>
        </label>

        <label>Heading Font
          <select id="heading-font-select">
            <option value="default">Default</option>
            <option value="impact">Impact</option>
            <option value="baskerville">Baskerville</option>
            <option value="didot">Didot</option>
            <option value="copperplate">Copperplate</option>
            <option value="georgia">Georgia</option>
            <option value="palatino">Palatino</option>
            <option value="marker">Marker Felt</option>
            <option value="papyrus">Papyrus</option>
            <option value="futura">Futura</option>
            <option value="chalkboard">Chalkboard</option>
            <option value="menlo">Menlo</option>
            <option value="garamond">Garamond</option>
          </select>
        </label>

        <label>Font size: <span id="font-size-label">100%</span>
          <input id="font-size" type="range" min="0.8" max="1.3" step="0.01" value="1.0" />
        </label>

        <label>Accent color
          <input id="accent-color" type="color" value="#0A78BF" />
        </label>

        <label>Header backdrop
          <select id="header-preset">
            <option value="default">Default</option>
            <option value="minerva">Minerva Mode</option>
            <option value="africa">Africa</option>
            <option value="americas">Americas</option>
            <option value="asia">Asia</option>
            <option value="europe">Europe</option>
            <option value="latin-america">Latin America</option>
            <option value="custom">Custom upload</option>
          </select>
        </label>

        <label>Upload header image
          <input id="header-upload" type="file" accept="image/*" />
        </label>

        <label>Banner message
          <input id="header-text" type="text" placeholder="Start your day with a quote..." />
        </label>

        <label class="checkbox-label"><input id="rounded-cards" type="checkbox" /> Rounded UI (sidebar + cards/panels)</label>

        <div class="calendar-section">
          <p class="instruction">Copy the CalDAV feed link and add it to your calendar application.</p>
          <button id="copy-calendar-btn" class="secondary-button" type="button">Copy calendar link</button>
          <p id="calendar-status" class="status-message" role="status" aria-live="polite"></p>
        </div>

        <div class="actions">
          <button id="reset-btn">Reset</button>
        </div>
        <p class="small-note">Use a 16:5 image ratio for best header fit. Custom upload replaces the selected backdrop.</p>
      </div>
    </div>

    <script src="../utils/defaults.js"></script>
    <script src="../utils/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
