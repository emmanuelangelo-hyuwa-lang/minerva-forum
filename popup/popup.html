<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Minerva Forum Customizer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h2>Minerva Customizer</h2>

      <label>Theme
        <select id="theme-select">
          <option value="default">Default</option>
          <option value="dark">Dark</option>
          <option value="high-contrast">High Contrast</option>
          <option value="warm">Warm</option>
        </select>
      </label>

      <label>Body Font
        <select id="font-select">
          <option value="default">Default</option>
          <option value="Inter">Inter</option>
          <option value="system-ui">System UI</option>
          <option value="Georgia">Georgia</option>
          <option value="JetBrains Mono">JetBrains Mono</option>
        </select>
      </label>

      <label>Heading Font
        <select id="heading-font-select">
          <option value="default">Default</option>
          <option value="Georgia">Georgia</option>
          <option value="Chronicle Deck A">Chronicle Deck A</option>
          <option value="Inter">Inter</option>
        </select>
      </label>

      <label>Font size: <span id="font-size-label">100%</span>
        <input id="font-size" type="range" min="0.8" max="1.3" step="0.01" value="1.0">
      </label>

      <label>Accent color
        <input id="accent-color" type="color" value="#0A78BF">
      </label>

      <label><input id="hide-imagery" type="checkbox"> Hide cityscape imagery</label>
      <label><input id="compact-sidebar" type="checkbox"> Compact sidebar</label>
      <label><input id="rounded-cards" type="checkbox"> Rounded UI</label>
      <label><input id="hide-intercom" type="checkbox"> Hide Intercom chat</label>

      <div class="actions">
        <button id="reset-btn">Reset</button>
      </div>
    </div>

    <script src="../utils/defaults.js"></script>
    <script src="../utils/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
