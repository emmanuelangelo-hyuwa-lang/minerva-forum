<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forum Customizer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <h1>Forum Customizer</h1>
      <button id="reset" class="text-button" type="button">Reset</button>
    </header>

    <nav class="tabs" role="tablist">
      <button role="tab" type="button" data-tab="theme" aria-selected="true">Theme</button>
      <button role="tab" type="button" data-tab="header" aria-selected="false">Header</button>
      <button role="tab" type="button" data-tab="text" aria-selected="false">Text</button>
    </nav>

    <main>
      <section class="panel" data-panel="theme" role="tabpanel">
        <h2 class="label">Light</h2>
        <div class="swatches" id="themes-light"></div>
        <h2 class="label">Dark</h2>
        <div class="swatches" id="themes-dark"></div>

        <div class="row">
          <span class="row-label">Accent</span>
          <div class="row-control">
            <button id="accent-reset" class="text-button" type="button">Use theme's</button>
            <input id="accent" type="color" aria-label="Accent color" />
          </div>
        </div>
        <div class="row">
          <span class="row-label">Corners</span>
          <div class="segmented" id="corners"></div>
        </div>
      </section>

      <section class="panel" data-panel="header" role="tabpanel" hidden>
        <div class="strips" id="headers"></div>
        <button id="upload" class="button" type="button">Upload and crop your own</button>
      </section>

      <section class="panel" data-panel="text" role="tabpanel" hidden>
        <div class="row">
          <span class="row-label">Size</span>
          <div class="row-control">
            <input id="text-size" type="range" aria-label="Text size" />
            <output id="text-size-value" for="text-size"></output>
          </div>
        </div>
        <h2 class="label">Fonts</h2>
        <div class="fonts" id="fonts"></div>
      </section>
    </main>

    <footer class="bottom">
      <a href="mailto:kunate0@gmail.com?subject=Bug%20Report" target="_blank" rel="noopener noreferrer">Report a bug</a>
    </footer>

    <script src="../utils/catalog.js"></script>
    <script src="../utils/defaults.js"></script>
    <script src="../utils/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
