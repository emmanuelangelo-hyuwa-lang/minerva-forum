<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Header image · Forum Customizer</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Header image</h1>
      <p class="lede">Upload a photo, then drag it and zoom until the part you want sits in the frame. The frame has the same shape as Forum's header.</p>

      <label class="drop" id="drop">
        <input id="file" type="file" accept="image/*" />
        <span id="drop-text">Choose an image or drop it here</span>
      </label>

      <section id="editor" hidden>
        <div class="frame" id="frame">
          <canvas id="canvas"></canvas>
          <div class="title-preview" aria-hidden="true">
            <strong>Welcome back</strong>
            <span>This is roughly where Forum puts the page title.</span>
          </div>
          <div class="trim left" aria-hidden="true"></div>
          <div class="trim right" aria-hidden="true"></div>
        </div>
        <p class="hint">Drag to reposition. Shaded edges get trimmed on smaller laptop screens.</p>

        <div class="controls">
          <label class="zoom">Zoom <input id="zoom" type="range" min="1" max="4" step="0.01" value="1" /></label>
          <div class="actions">
            <button id="remove" class="secondary" type="button" hidden>Remove custom header</button>
            <button id="save" class="primary" type="button">Save header</button>
          </div>
        </div>
        <p class="status" id="status" role="status"></p>
      </section>
    </main>

    <script src="../utils/catalog.js"></script>
    <script src="../utils/defaults.js"></script>
    <script src="../utils/storage.js"></script>
    <script src="options.js"></script>
  </body>
</html>
